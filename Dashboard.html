<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qiddiya Media Pacing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1726; --ink-2:#33415A; --ink-3:#6B7A93; --ink-4:#94A2B8;
  --bg:#F4F7FA; --surface:#FFFFFF; --line:#DFE6EE; --line-soft:#EDF2F7;
  --sf-1:#ED1D23; --sf-2:#3EAAE0;
  --aq-1:#0C98DF; --aq-2:#55C4CE;
  --good:#1F8A5B; --good-bg:#E3F3EB;
  --warn:#B57A0C; --warn-bg:#FBF0DA;
  --crit:#C0392F; --crit-bg:#FBE7E5;
  --accent:var(--sf-1); --accent-2:var(--sf-2);
  --display:'Outfit',system-ui,sans-serif; --body:'Outfit',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(14,23,38,.05),0 6px 20px -12px rgba(14,23,38,.18);
}
html[data-brand="AAQC"]{
  --accent:var(--aq-1); --accent-2:var(--aq-2);
  --display:'Montserrat',system-ui,sans-serif; --body:'Montserrat',system-ui,sans-serif;
}
html[data-brand="BOTH"]{ --accent:#1D2B57; --accent-2:#5A6B99; }
@media (prefers-color-scheme:dark){:root{
  --ink:#EAF0F7; --ink-2:#B9C6D6; --ink-3:#8695AB; --ink-4:#5F6E85;
  --bg:#0D1725; --surface:#141F30; --line:#243146; --line-soft:#1B2739;
  --good:#57C994; --good-bg:#16302A; --warn:#E0B457; --warn-bg:#312717; --crit:#F2857C; --crit-bg:#341D1E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.8);}}
:root[data-theme="dark"]{
  --ink:#EAF0F7; --ink-2:#B9C6D6; --ink-3:#8695AB; --ink-4:#5F6E85;
  --bg:#0D1725; --surface:#141F30; --line:#243146; --line-soft:#1B2739;
  --good:#57C994; --good-bg:#16302A; --warn:#E0B457; --warn-bg:#312717; --crit:#F2857C; --crit-bg:#341D1E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.8);}
:root[data-theme="light"]{
  --ink:#0E1726; --ink-2:#33415A; --ink-3:#6B7A93; --ink-4:#94A2B8;
  --bg:#F4F7FA; --surface:#FFFFFF; --line:#DFE6EE; --line-soft:#EDF2F7;
  --good:#1F8A5B; --good-bg:#E3F3EB; --warn:#B57A0C; --warn-bg:#FBF0DA; --crit:#C0392F; --crit-bg:#FBE7E5;
  --shadow:0 1px 2px rgba(14,23,38,.05),0 6px 20px -12px rgba(14,23,38,.18);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
@media(max-width:900px){.shell{grid-template-columns:1fr}}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:900px){.rail{position:static;height:auto}}
.mark{padding:20px 18px 15px;border-bottom:1px solid var(--line-soft)}
.mark .kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
.mark .name{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:3px;
  display:flex;align-items:center;gap:8px}
.mark .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
nav{padding:10px;display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;font-size:13px;
  color:var(--ink-2);text-align:left;transition:.12s;width:100%}
nav button:hover{background:var(--line-soft)}
nav button[aria-current="true"]{background:var(--line-soft);color:var(--ink);font-weight:600}
nav button[aria-current="true"] .bar{background:var(--accent)}
nav .bar{width:3px;height:15px;border-radius:2px;background:transparent;flex:none}
.rail-foot{margin-top:auto;padding:14px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--ink-4)}
.rail-foot b{color:var(--ink-3);font-weight:600}

main{padding:20px 24px 60px;max-width:1600px;width:100%;min-width:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
.head .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.head .sub b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}

/* ---- filter bar ---- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.fgroup{display:flex;align-items:center;gap:7px}
.flabel{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 11px;font-size:12px;color:var(--ink-3);border-right:1px solid var(--line);transition:.12s}
.seg button:last-child{border-right:0}
.seg.wrap{flex-wrap:wrap;max-width:640px}
.seg.wrap button{border-bottom:1px solid var(--line)}
.filters{align-items:flex-start}
.fgroup{align-items:flex-start}
.fgroup .flabel{padding-top:7px}
.seg button:hover{background:var(--line-soft)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
input[type="date"],.filters select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--surface);font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
.filters select{padding-right:24px;cursor:pointer;font-weight:500}
.fsep{width:1px;height:24px;background:var(--line);margin:0 2px}
.reset{font-size:12px;color:var(--ink-3);padding:6px 10px;border-radius:7px;border:1px solid transparent}
.reset:hover{border-color:var(--line);color:var(--ink)}
.fhint{font-size:11px;color:var(--ink-4);align-self:center;margin-left:auto}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:11.5px;
  color:var(--ink-2);background:var(--surface);font-weight:500;white-space:nowrap}
.chip.live{display:inline-flex;align-items:center;gap:6px}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.chip.bad{border-color:var(--crit);color:var(--crit)}
.chip.bad::before{background:var(--crit)}
.refresh-btn{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface);font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.refresh-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.refresh-btn:disabled{opacity:.65;cursor:wait}
.refresh-btn.snapshot:disabled{cursor:not-allowed}
.refresh-status{font-size:11px;color:var(--ink-3);max-width:250px}
.refresh-status.bad{color:var(--crit)}

/* ---- kpi ---- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.85}
.kpi.frozen::before{background:var(--ink-4);opacity:.45}
.kpi .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);font-weight:600;
  display:flex;align-items:center;gap:6px}
.kpi .v{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.025em;margin-top:4px;
  font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .spark{margin-top:7px;display:block;width:100%;height:26px;cursor:crosshair}

/* ---- panels ---- */
.grid{display:grid;gap:13px;margin-bottom:13px}
.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.6fr 1fr}
.g12{grid-template-columns:1fr 1.6fr}
@media(max-width:1180px){.g2,.g21,.g12{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-width:0}
.panel.frozen{border-style:dashed}
.ph{padding:12px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h3{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.ph .note{font-size:11.5px;color:var(--ink-4)}
.pb{padding:13px 15px}
.pb.flush{padding:0}
canvas{display:block;width:100%}

/* ---- tables ---- */
.tw{overflow-x:auto}
.tw.cap{max-height:340px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:140px;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
thead th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);font-weight:600;
  background:var(--surface);position:sticky;top:0;z-index:1;border-bottom:1px solid var(--line)}
tbody tr:hover{background:var(--line-soft)}
tbody td{font-variant-numeric:tabular-nums;color:var(--ink-2)}
tbody td:first-child{color:var(--ink);font-weight:500}
tfoot td{font-weight:700;color:var(--ink);border-top:2px solid var(--line);border-bottom:0;
  font-variant-numeric:tabular-nums;background:var(--surface)}
tbody tr.grp td{background:var(--line-soft);font-weight:700;color:var(--ink);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody tr.grp:hover td{background:var(--line-soft)}
tbody tr.grp td:first-child{font-size:12.5px}
tbody tr.syn td{font-style:italic;color:var(--ink-3)}
tbody tr.grp .cnt{font-weight:600;font-size:10.5px;color:var(--ink-3);background:var(--surface);
  padding:1px 6px;border-radius:999px;margin-left:6px}
sup.src{font-size:8.5px;font-weight:700;padding:1px 3px;border-radius:3px;margin-left:2px;vertical-align:2px}
sup.src.adj{background:#E3F3EB;color:#1F8A5B}
sup.src.ga4{background:#E7EEFB;color:#3155A4}
:root[data-theme="dark"] sup.src.adj,html:not([data-theme]) sup.src.adj{background:#16302A;color:#57C994}
:root[data-theme="dark"] sup.src.ga4,html:not([data-theme]) sup.src.ga4{background:#1B2A47;color:#8FB0EC}
:root[data-theme="light"] sup.src.adj{background:#E3F3EB;color:#1F8A5B}
:root[data-theme="light"] sup.src.ga4{background:#E7EEFB;color:#3155A4}
.srckey{display:flex;flex-wrap:wrap;gap:14px;padding:9px 14px;font-size:11px;color:var(--ink-4);
  border-top:1px solid var(--line-soft)}
.srckey span{display:flex;align-items:center;gap:5px}
.sortable{cursor:pointer;user-select:none}
.sorted::after{content:"▾";margin-left:4px;font-size:9px}
.sorted.asc::after{content:"▴"}

/* ---- bits ---- */
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.mute{background:var(--line-soft);color:var(--ink-3)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:10.5px;font-weight:600;
  background:var(--line-soft);color:var(--ink-3)}
.tag.frz{background:var(--warn-bg);color:var(--warn)}
.pdot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:1px}
.delta{font-weight:600;font-variant-numeric:tabular-nums}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)} .delta.flat{color:var(--ink-4)}
.legend{display:flex;flex-wrap:wrap;gap:9px 15px;padding:9px 15px 13px;font-size:11.5px;color:var(--ink-3)}
.legend span{display:flex;align-items:center;gap:6px}
.empty{padding:24px;text-align:center;color:var(--ink-4);font-size:13px}
.callout{display:block;padding:10px 13px;border-radius:9px;background:var(--warn-bg);
  border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);font-size:12.5px;color:var(--ink-2);
  margin-bottom:13px;line-height:1.6}
.callout b{color:var(--ink);font-weight:600}
.loading,.error{padding:60px 20px;text-align:center;color:var(--ink-3)}
.error{color:var(--crit)}

/* ---- insights ---- */
.ins{display:flex;flex-direction:column;gap:0}
.ins li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:baseline;padding:10px 0;
  border-bottom:1px solid var(--line-soft);list-style:none}
.ins li:last-child{border-bottom:0}
.ins .ico{font-size:15px;line-height:1;text-align:center}
.ins .txt{font-size:12.5px;color:var(--ink-2)}
.ins .txt b{color:var(--ink);font-weight:600}
.ins .val{font-family:var(--display);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- ranked list ---- */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line-soft)}
.rank li:last-child{border-bottom:0}
.rank .rk{font-size:11px;font-weight:700;color:var(--ink-4);font-variant-numeric:tabular-nums}
.rank .rn{min-width:0;font-size:12.5px;color:var(--ink);font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rank .rn em{display:block;font-style:normal;font-size:11px;color:var(--ink-4);font-weight:400;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .rv{font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- small multiples ---- */
.sm{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:11px}
.smc{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--surface)}
.smc .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
.smc .t .nm{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.smc .v{font-family:var(--display);font-size:17px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.smc .m{font-size:11px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.smc canvas{margin-top:7px;height:38px;cursor:crosshair}

/* ---- claimed vs verified ---- */
.cv{display:flex;flex-direction:column;gap:12px}
.cvr .h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:5px}
.cvr .h .nm{font-weight:600;display:flex;align-items:center;gap:6px}
.cvbar{position:relative;height:10px;border-radius:5px;background:var(--line-soft);overflow:hidden}
.cvbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.cvbar .claim{background:var(--ink-4);opacity:.35}
.cvbar .ver{background:var(--accent)}
.cvr .f{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-4);margin-top:4px;
  font-variant-numeric:tabular-nums}

/* ---- tooltip ---- */
#tip{position:fixed;pointer-events:none;z-index:99;background:var(--ink);color:var(--bg);
  padding:8px 10px;border-radius:7px;font-size:11.5px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.28);
  opacity:0;transition:opacity .1s;max-width:250px;font-variant-numeric:tabular-nums}
#tip.on{opacity:1}
#tip .tt{font-weight:700;margin-bottom:3px;font-size:12px}
#tip .tr{display:flex;justify-content:space-between;gap:14px}
#tip .tr span:first-child{opacity:.7}
/* ---- line explainer ---- */
.ex{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;overflow:hidden;background:var(--surface)}
.ex[open]{border-color:var(--accent)}
.ex summary{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:10px;
  padding:11px 13px;cursor:pointer;list-style:none;font-size:13px}
.ex summary::-webkit-details-marker{display:none}
.ex summary::after{content:"+";font-size:15px;color:var(--ink-4);width:14px;text-align:center;order:5}
.ex[open] summary::after{content:"−"}
.ex summary:hover{background:var(--line-soft)}
.ex .exn{font-weight:600;display:flex;align-items:center;gap:7px}
.ex .exm{font-size:11.5px;color:var(--ink-4)}
.ex .exv{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;min-width:76px;text-align:right}
.exb{padding:0 13px 13px;border-top:1px solid var(--line-soft)}
.exrow{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:8px 0;font-size:12.5px;
  border-bottom:1px solid var(--line-soft)}
.exrow>span:first-child{color:var(--ink-4);font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:600;padding-top:2px}
.exrow>span:last-child{color:var(--ink-2)}
.exrow code{background:var(--line-soft);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:11.5px}
#views .tw table{font-size:12px}
#views .tw th,#views .tw td{padding:7px 7px}
#views .tw th:first-child,#views .tw td:first-child{min-width:132px;padding-left:12px}
.extab{margin-top:11px;font-size:12px}
.extab th{font-size:10px;padding:6px 8px}
.extab td{padding:6px 8px}
.extab td:first-child{min-width:0;font-size:11.5px;font-weight:400;color:var(--ink-2);
  word-break:break-all;white-space:normal}
.exnote{margin-top:11px;padding:10px 12px;background:var(--warn-bg);border-radius:7px;
  font-size:12px;color:var(--ink-2)}
.view{display:none}.view.on{display:block}
.callout.crit{background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
#health details.callout summary{cursor:pointer}
#health ul{margin:8px 0 0;padding:0;list-style:none}
#health li{margin:6px 0;line-height:1.5}
td.mute{color:var(--ink-4)}
.rowno{font-size:10.5px;color:var(--ink-4);font-weight:500;margin-left:4px;white-space:nowrap}
</style>
</head>
<body>
<div id="tip"></div>
<div class="shell">
  <aside class="rail">
    <div class="mark">
      <div class="kicker">Qiddiya City</div>
      <div class="name"><span class="dot"></span><span id="brandName">Six Flags</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <div>Built from <b>Raw data</b>, <b>APPLE1</b>, <b>Raw manual</b>, <b>Adjust Raw</b>, <b>GA4</b> — the cells the pacing tabs read</div>
      <div id="stamp" style="margin-top:5px"></div>
    </div>
  </aside>
  <main>
    <div id="loading" class="loading">Reading the sheets…</div>
    <div id="error" class="error" style="display:none"></div>
    <div id="app" style="display:none">
      <div class="head">
        <div>
          <h1 id="title">Summary</h1>
          <div class="sub" id="sub"></div>
        </div>
        <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
          <button class="refresh-btn" id="refreshBtn" type="button" onclick="refreshDashboard()">↻ Refresh</button>
          <span class="refresh-status" id="refreshStatus" role="status" aria-live="polite"></span>
          <span class="chip live" id="checkChip">reconciled</span>
          <span class="chip" id="fxChip"></span>
        </div>
      </div>
      <div id="health"></div>
      <div class="filters" id="filters"></div>
      <div class="kpis" id="kpis"></div>
      <div id="views"></div>
    </div>
  </main>
</div>

<script>
/* ================================================================
 * state
 * ================================================================ */
var DATA=null, BRAND='SFQC', VIEW='summary';
/* obj and plat are multi-select: an empty list means no restriction. */
var F={from:null,to:null,obj:[],plat:[]};
var SORT={key:'row',dir:1};
var DAILY_METRIC='spend', EFF_METRIC='cpi';
var GROUP='plat', CSORT={key:'spend',dir:-1}, COLSET='core';
var REFRESHING=false, RANGE_PRESET=null;

var VIEWS=[['summary','Summary'],['trend','Trend'],['platforms','Platforms'],
           ['campaigns','Campaigns'],['attribution','Attribution'],['method','How it adds up']];

var PLAT_COLOR={Snapchat:'#F5C518',TikTok:'#25C4C4',Meta:'#4B7BEC',Google:'#E8734A',
  X:'#7A8699',Apple:'#9B7EDE',InMobi:'#C0567E',InMotion:'#5AA469',Bidease:'#8C7B6B',Other:'#A3A9B3'};

/* raw row indices — OBJ is Raw data column M, the pacing row's objective */
var P=0,B=1,C=2,D=3,RCH=4,IMP=5,SPD=6,LPV=7,CLK=8,VW=9,INS=10,PUR=11,OBJ=12;

/* ================================================================
 * formatting
 * ================================================================ */
function n0(v){return v==null||isNaN(v)?'—':Math.round(v).toLocaleString('en-US');}
function n2(v){return v==null||isNaN(v)?'—':v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function usd(v){return v==null||isNaN(v)?'—':(v<0?'-$':'$')+Math.abs(Math.round(v)).toLocaleString('en-US');}
function usd2(v){return v==null||isNaN(v)?'—':(v<0?'-$':'$')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function sar(v){return v==null||isNaN(v)?'—':Math.round(v).toLocaleString('en-US')+' SAR';}
function pct(v){return v==null||isNaN(v)?'—':v.toFixed(2)+'%';}
var BRANDS={SFQC:'Six Flags',AAQC:'Aquarabia',BOTH:'Both portals'};
function brandMatch(b){return BRAND==='BOTH'?true:b===BRAND;}
function brandList(){return BRAND==='BOTH'?['SFQC','AAQC']:[BRAND];}
function brandTag(){return '<span class="tag">'+(BRAND==='BOTH'?'SFQC + AAQC':BRAND)+'</span>';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shortDay(d){var p=d.split('-');return p[2]+'/'+p[1];}

/* ================================================================
 * the pacing rows
 * The server sends the row table the pacing formulas are generated from (meta.lines).
 * Raw rows carry their objective (Raw data column M); Adjust and GA4 rows carry the row
 * they land on. Nothing is classified a second time in the browser, so the dashboard
 * cannot file a number on a different row than the pacing tab does.
 * ================================================================ */
var LINE_INFO={};
function lineInfo(k){return LINE_INFO[k]||{row:99,key:k,plat:k.split('|')[0],obj:k.split('|')[1],label:k.replace('|',' — '),web:false,media:true};}
/* Revenue (column X): Adjust on every row, unless the sheet is set to read the four web
   rows from GA4 (CFG.WEB_REVENUE_FROM_GA4). Never both — the same sale would count twice. */
function webRevenue(k){return !!(DATA&&DATA.meta.webRevenueFromGa4&&lineInfo(k).web);}
function lineMatch(k){var p=k.split('|');return platMatch(p[0])&&objMatch(p[1]);}
/* A platform whose channel never appears in Adjust Raw at all (any date): its zero
   installs mean "no feed", not "no installs". */
function noFeed(brand,plat){
  var list=(DATA&&DATA.meta.health&&DATA.meta.health.noAdjustFeed)||[];
  if(brand) return list.indexOf(brand+'|'+plat)>=0;
  return brandList().some(function(b){return list.indexOf(b+'|'+plat)>=0;});
}
/* Campaign names are the join between Raw data, Adjust and GA4. They agree
   character for character on the overwhelming majority of the volume, so this
   only folds the three things that are typography rather than identity: case,
   en/em dashes, and runs of whitespace. */
function normCamp(s){
  return String(s==null?'':s).trim().toLowerCase()
    .replace(/[–—]/g,'-').replace(/\s+/g,' ');
}
/* Adjust and GA4 name things that are not campaigns at all. */
var NOT_A_CAMPAIGN={'unknown':1,'anonymous ips':1,'expired attributions':1,
  'organic share':1,'anomaly':1,'untrusted devices':1,'$campaign_name':1,'':1};
function isNamelessCamp(c){ return NOT_A_CAMPAIGN[normCamp(c)]===1; }
/* Every platform the user can filter to: whatever spends, plus Adjust/GA4-only rows
   (Bidease, InMotion, Other) that book results without media rows. */
function platOptions(){
  var s={};
  DATA.raw.forEach(function(r){ if(brandMatch(r[B])) s[r[P]]=1; });
  DATA.adjust.forEach(function(a){ if(brandMatch(a.brand)) s[a.line.split('|')[0]]=1; });
  DATA.ga4.forEach(function(g){ if(brandMatch(g.brand)) s[g.line.split('|')[0]]=1; });
  return Object.keys(s).sort(function(a,b){
    return a==='Other'?1:b==='Other'?-1:a.localeCompare(b);
  });
}
function platMatch(p){ return !F.plat.length||F.plat.indexOf(p)>=0; }
/* Row 26 (Other) has no objective, so any objective filter leaves it out. */
function objMatch(o){ return !F.obj.length||F.obj.indexOf(o)>=0; }
function sourceCoverageStatus(){
  var coverage=DATA&&DATA.meta&&DATA.meta.sourceCoverage;
  if(!coverage)return null;
  var brands=brandList();
  function latest(rows){
    var last='';
    (rows||[]).forEach(function(r){
      if(brands.indexOf(r.brand)<0||!lineMatch(r.platform+'|'+r.objective))return;
      if(r.last>last)last=r.last;
    });
    return last;
  }
  var mediaLast=latest(coverage.media),adjustLast=latest(coverage.adjust),gaLast=latest(coverage.ga4);
  var parts=[];
  if(mediaLast)parts.push('Media '+shortDay(mediaLast));
  if(adjustLast)parts.push('Adjust '+shortDay(adjustLast));
  if(gaLast)parts.push('GA4 '+shortDay(gaLast));
  if(!parts.length)return null;
  return {text:parts.join(' · '),bad:[mediaLast,adjustLast,gaLast].some(function(d){
    return d&&d<F.to;
  })};
}
function healthIssues(){return (DATA&&DATA.meta.health&&DATA.meta.health.issues)||[];}

/* ================================================================
 * boot
 * ================================================================ */
function boot(){
  if(typeof EMBEDDED_PAYLOAD!=='undefined'&&EMBEDDED_PAYLOAD){
    document.getElementById('refreshBtn').classList.add('snapshot');
    init(EMBEDDED_PAYLOAD);
    setRefreshState(false,'Snapshot — re-export from the sheet for new numbers');
    return;
  }
  google.script.run.withSuccessHandler(init).withFailureHandler(fail).getPacingDashboardData();
}
function setRefreshState(pending,message,bad){
  REFRESHING=pending;
  var button=document.getElementById('refreshBtn');
  button.disabled=pending||(typeof EMBEDDED_PAYLOAD!=='undefined'&&!!EMBEDDED_PAYLOAD);
  button.textContent=pending?'↻ Refreshing…':'↻ Refresh';
  var status=document.getElementById('refreshStatus');
  status.textContent=message||'';
  status.className='refresh-status'+(bad?' bad':'');
}
function refreshDashboard(){
  if(REFRESHING)return;
  if(typeof EMBEDDED_PAYLOAD!=='undefined'&&EMBEDDED_PAYLOAD){
    setRefreshState(false,'Snapshot — re-export from the sheet for new numbers',true);
    return;
  }
  if(typeof google==='undefined'||!google.script||!google.script.run){
    setRefreshState(false,'Live sheet refresh is unavailable here',true);
    return;
  }
  setRefreshState(true,'Reading latest sheet data…');
  google.script.run.withSuccessHandler(function(p){
    try{
      if(!p||!p.meta||!p.raw||!p.adjust||!p.ga4)
        throw new Error('Incomplete sheet response');
      init(p,true);
      setRefreshState(false,p.meta.generated||'Updated from sheets');
    }catch(e){
      setRefreshState(false,'Refresh failed: '+(e&&e.message?e.message:e),true);
    }
  }).withFailureHandler(function(e){
    setRefreshState(false,'Refresh failed: '+(e&&e.message?e.message:e),true);
  }).getPacingDashboardData();
}
function fail(e){
  document.getElementById('loading').style.display='none';
  var el=document.getElementById('error');el.style.display='block';
  el.textContent='Could not read the sheets: '+(e&&e.message?e.message:e);
}
function init(p,keepFilters){
  if(!p.meta||!p.meta.lines){
    fail(new Error('The server code is older than this page. Paste the new Code.gs and deploy a new version.'));
    return;
  }
  var previous=keepFilters&&DATA?{
    from:F.from,to:F.to,full:isFullPeriod(),preset:RANGE_PRESET,
    obj:F.obj.slice(),plat:F.plat.slice()
  }:null;
  /* The payload ships campaign names once in p.camps and every row points at one by
     index. Put the name back on the row here, once. */
  (p.raw||[]).forEach(function(r){ r[C]=p.camps[r[C]]||''; });
  (p.adjust||[]).forEach(function(a){ a.camp=p.camps[a.ci]||''; });
  (p.ga4||[]).forEach(function(g){ g.camp=p.camps[g.ci]||''; });
  LINE_INFO={};
  p.meta.lines.forEach(function(l){LINE_INFO[l.key]=l;});
  DATA=p;
  _pfx={};
  if(previous){
    F.obj=previous.obj;F.plat=previous.plat;RANGE_PRESET=previous.preset;
    if(RANGE_PRESET===7||RANGE_PRESET===14){
      var days=p.meta.days||[];
      F.from=days[Math.max(0,days.length-RANGE_PRESET)]||p.meta.start;
      F.to=p.meta.end;
    }else if(previous.full){
      F.from=p.meta.start;F.to=p.meta.end;
    }else{
      F.from=previous.from<p.meta.start?p.meta.start:previous.from>p.meta.end?p.meta.end:previous.from;
      F.to=previous.to<p.meta.start?p.meta.start:previous.to>p.meta.end?p.meta.end:previous.to;
    }
  }else{F.from=p.meta.start;F.to=p.meta.end;RANGE_PRESET=null;}
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('fxChip').textContent='1 USD = '+p.meta.fx+' SAR';
  document.getElementById('stamp').textContent=p.meta.generated||'';
  document.getElementById('nav').innerHTML=VIEWS.map(function(v){
    return '<button onclick="setView(\''+v[0]+'\')" data-v="'+v[0]+'"><span class="bar"></span>'+v[1]+'</button>';
  }).join('');
  render();
}
function setBrand(b){
  BRAND=b;document.documentElement.setAttribute('data-brand',b);
  document.getElementById('brandName').textContent=BRANDS[b];
  _pfx={};
  // the other portal may not run this platform — don't leave the user on an empty screen
  var avail=platOptions();
  F.plat=F.plat.filter(function(p){return avail.indexOf(p)>=0;});
  render();
}
function setView(v){VIEW=v;render();}
function toggleIn(list,v){
  var i=list.indexOf(v);
  if(i>=0) list.splice(i,1); else list.push(v);
  return list;
}
function setObj(o){ if(o==='all')F.obj=[]; else toggleIn(F.obj,o); render(); }
function setPlat(p){ if(p==='all')F.plat=[]; else toggleIn(F.plat,p); render(); }
function setGroup(g){GROUP=g;render();}
function setColset(c){COLSET=c;render();}
function csortBy(k){CSORT=CSORT.key===k?{key:k,dir:-CSORT.dir}:{key:k,dir:-1};render();}
function setRange(from,to){F.from=from;F.to=to;RANGE_PRESET=null;render();}
function clearFilters(){
  F.from=DATA.meta.start;F.to=DATA.meta.end;F.obj=[];F.plat=[];RANGE_PRESET=null;render();
}
function preset(days){
  RANGE_PRESET=days;
  var all=DATA.meta.days;
  if(days==null){F.from=DATA.meta.start;F.to=DATA.meta.end;}
  else{var i=Math.max(0,all.length-days);F.from=all[i];F.to=DATA.meta.end;}
  render();
}
function onDate(which,val){
  if(!val) return;
  RANGE_PRESET=null;
  if(which==='from') F.from=val; else F.to=val;
  if(F.from>F.to){var t=F.from;F.from=F.to;F.to=t;}
  render();
}
function isFullPeriod(){return F.from===DATA.meta.start&&F.to===DATA.meta.end;}
function isFiltered(){return !isFullPeriod()||F.obj.length>0||F.plat.length>0;}

/* ================================================================
 * selection — every source filtered the same way: portal, dates, pacing row
 * ================================================================ */
function rowsRaw(){
  return DATA.raw.filter(function(r){
    if(!brandMatch(r[B])) return false;
    if(r[D]<F.from||r[D]>F.to) return false;
    return lineMatch(r[P]+'|'+r[OBJ]);
  });
}
function daysInRange(){
  return DATA.meta.days.filter(function(d){return d>=F.from&&d<=F.to;});
}
function sumRaw(rs){
  var t={spend:0,impr:0,clicks:0,lpv:0,views:0,inst:0,purch:0};
  rs.forEach(function(r){
    t.spend+=r[SPD];t.impr+=r[IMP];t.clicks+=r[CLK];t.lpv+=r[LPV];
    t.views+=r[VW];t.inst+=r[INS];t.purch+=r[PUR];
  });
  t.cpm=t.impr?t.spend/t.impr*1000:null;
  t.cpc=t.clicks?t.spend/t.clicks:null;
  t.ctr=t.impr?t.clicks/t.impr*100:null;
  t.cpiPlat=t.inst?t.spend/t.inst:null;
  return t;
}
/* Every Adjust row carries its own day and its pacing row, so the date picker and the
   filters move installs, bookings and revenue exactly the way they move spend. */
function adjustRows(){
  return DATA.adjust.filter(function(a){
    if(a.day<F.from||a.day>F.to) return false;
    if(!brandMatch(a.brand)) return false;
    return lineMatch(a.line);
  });
}
function ga4Rows(){
  return DATA.ga4.filter(function(g){
    if(g.day<F.from||g.day>F.to) return false;
    if(!brandMatch(g.brand)) return false;
    return lineMatch(g.line);
  });
}
/* Totals come from the lines, so a total can never disagree with the rows above it. */
function totals(ln){
  var t={spend:0,adjInst:0,paidInst:0,bookings:0,revenue:0,adjRev:0,ga4Tx:0,ga4Rev:0};
  (ln||lines()).forEach(function(l){
    t.spend+=l.spend;t.adjInst+=l.adjInst;t.bookings+=l.bookings;t.revenue+=l.revenue;
    t.adjRev+=l.adjRev;t.ga4Tx+=l.ga4Tx;t.ga4Rev+=l.ga4Rev;
  });
  adjustRows().forEach(function(a){ t.paidInst+=a.paidInst; });
  return t;
}
/* The last day in the range that any media row reaches — a window whose end date has
   not been delivered yet must not dilute the per-day figures. */
function lastMediaDay(){
  var last='';
  rowsRaw().forEach(function(r){ if(r[D]>last) last=r[D]; });
  return last;
}

/* by-day series over the active range */
function series(){
  var rs=rowsRaw(), days=daysInRange(), map={};
  days.forEach(function(d){map[d]={day:d,spend:0,impr:0,clicks:0,inst:0,purch:0,views:0,
    adjInst:0,bookings:0,revenue:0,ga4Tx:0,ga4Rev:0,byPlat:{}};});
  rs.forEach(function(r){
    var e=map[r[D]];if(!e)return;
    e.spend+=r[SPD];e.impr+=r[IMP];e.clicks+=r[CLK];e.inst+=r[INS];e.purch+=r[PUR];e.views+=r[VW];
    e.byPlat[r[P]]=(e.byPlat[r[P]]||0)+r[SPD];
  });
  /* Adjust and GA4 land on their own day, so a CPI on a row divides two figures
     measured over the same 24 hours. Revenue follows column X's rule per row. */
  adjustRows().forEach(function(a){
    var e=map[a.day];if(!e)return;
    e.adjInst+=a.inst; e.bookings+=a.bookings;
    if(!webRevenue(a.line)) e.revenue+=a.revenue;
  });
  ga4Rows().forEach(function(g){
    var e=map[g.day];if(!e)return;
    e.ga4Tx+=g.tx; e.ga4Rev+=g.revenue;
    if(webRevenue(g.line)) e.revenue+=g.revenue;
  });
  return days.map(function(d){return map[d];});
}
function platsActive(){
  var s={};rowsRaw().forEach(function(r){s[r[P]]=1;});
  return DATA.meta.plats.filter(function(p){return s[p];});
}
/* pacing rows = platform × objective, plus row 26 (Other) — the same rows as the tab */
function lines(){
  var m={};
  function get(k){
    if(m[k])return m[k];
    var li=lineInfo(k);
    return (m[k]={key:k,row:li.row,label:li.label,plat:li.plat,obj:li.obj,media:li.media,
      spend:0,impr:0,clicks:0,views:0,lpv:0,inst:0,purch:0,
      adjInst:0,bookings:0,adjRev:0,paidInst:0,ga4Tx:0,ga4Rev:0});
  }
  rowsRaw().forEach(function(r){
    var e=get(r[P]+'|'+r[OBJ]);
    e.spend+=r[SPD];e.impr+=r[IMP];e.clicks+=r[CLK];e.views+=r[VW];e.lpv+=r[LPV];
    e.inst+=r[INS];e.purch+=r[PUR];
  });
  adjustRows().forEach(function(a){
    var e=get(a.line);
    e.adjInst+=a.inst;e.bookings+=a.bookings;e.adjRev+=a.revenue;e.paidInst+=a.paidInst;
  });
  ga4Rows().forEach(function(g){
    var e=get(g.line);
    e.ga4Tx+=g.tx;e.ga4Rev+=g.revenue;
  });
  return Object.keys(m).map(function(k){
    var e=m[k];
    var web=webRevenue(k);
    e.revenue=web?e.ga4Rev:e.adjRev;                                   // X
    e.revSrc=web?'GA4':'Adjust';
    e.noFeed=e.plat!=='Other'&&noFeed('',e.plat);
    /* Columns E..X, matching the pacing tab one for one. */
    e.spendSar=e.spend*DATA.meta.fx;                                   // F
    e.cpm=e.impr?e.spend/e.impr*1000:null;                             // Q
    e.cpv=e.views?e.spend/e.views:null;                                // R
    e.cpc=e.clicks?e.spend/e.clicks:null;                              // S
    e.ctr=e.impr?e.clicks/e.impr*100:null;                             // T
    e.vtr=e.impr?e.views/e.impr*100:null;                              // U
    e.cvrPurch=e.clicks?e.purch/e.clicks*100:null;                     // V
    e.cvrInst=e.clicks?e.inst/e.clicks*100:null;                       // W
    e.cpi=(e.spend>0&&e.adjInst)?e.spend/e.adjInst:null;               // spend / Adjust installs
    e.cpa=(e.spend>0&&e.bookings)?e.spend/e.bookings:null;             // spend / Adjust bookings
    e.roas=e.spendSar?e.revenue/e.spendSar:null;                       // P = X / F
    return e;
  }).filter(function(e){
    return e.spend||e.impr||e.clicks||e.inst||e.purch||e.adjInst||e.bookings||e.adjRev||e.ga4Tx||e.ga4Rev;
  }).sort(function(x,y){return x.row-y.row||y.spend-x.spend;});
}
function campaigns(){
  var m={};
  rowsRaw().forEach(function(r){
    var ck=r[B]+'|'+r[P]+'|'+r[OBJ]+'|'+normCamp(r[C]);
    var e=m[ck]||(m[ck]={name:r[C],brand:r[B],plat:r[P],obj:r[OBJ],spend:0,impr:0,clicks:0,
      inst:0,purch:0,views:0,days:{},adjInst:0,bookings:0,adjRev:0,ga4Tx:0,ga4Rev:0});
    e.spend+=r[SPD];e.impr+=r[IMP];e.clicks+=r[CLK];e.inst+=r[INS];e.purch+=r[PUR];
    e.views+=r[VW];e.days[r[D]]=1;
  });
  var list=Object.keys(m).map(function(k){return m[k];});

  /* Adjust and GA4 both name the campaign, and it is the same name Raw data
     carries. So installs, bookings and revenue are LOOKED UP per campaign, not
     shared out by spend. The key includes the pacing row, so a campaign can only
     receive numbers filed on its own row — that keeps every column adding back to
     the line table (and so to the pacing tab) exactly. */
  var idx={};
  list.forEach(function(c){ idx[c.brand+'|'+c.plat+'|'+c.obj+'|'+normCamp(c.name)]=c; });

  /* Anything Adjust or GA4 names that Raw data never spent on gets its own row, so the
     table still totals to the pacing tab without folding results into campaigns that did
     not earn them. */
  var extra={};
  function unmatched(brand,plat,obj,name){
    var nm=isNamelessCamp(name)
      ? (String(name||'').trim()||'no campaign name')+' — '+plat+' · not tied to a campaign'
      : String(name).trim();
    var k=brand+'|'+plat+'|'+obj+'|'+normCamp(nm);
    var e=extra[k];
    if(!e) e=extra[k]={name:nm,brand:brand,plat:plat,obj:obj,spend:0,impr:0,clicks:0,
      inst:0,purch:0,views:0,days:{},adjInst:0,bookings:0,adjRev:0,ga4Tx:0,ga4Rev:0,
      noSpend:true,synthetic:isNamelessCamp(name)};
    return e;
  }
  adjustRows().forEach(function(a){
    var p=a.line.split('|');
    var t=idx[a.brand+'|'+a.line+'|'+normCamp(a.camp)]||unmatched(a.brand,p[0],p[1],a.camp);
    t.adjInst+=a.inst; t.bookings+=a.bookings; t.adjRev+=a.revenue;
  });
  ga4Rows().forEach(function(g){
    var p=g.line.split('|');
    var t=idx[g.brand+'|'+g.line+'|'+normCamp(g.camp)]||unmatched(g.brand,p[0],p[1],g.camp);
    t.ga4Tx+=g.tx; t.ga4Rev+=g.revenue;
  });
  Object.keys(extra).forEach(function(k){ list.push(extra[k]); });

  /* Apple Search Ads hands Adjust the string "unknown" instead of a campaign, so its
     spending campaigns measure zero while a nameless row holds the installs. A line
     counts as blind only when the nameless rows hold MORE of it than the named
     campaigns do. */
  var named={},nameless={};
  list.forEach(function(c){
    var k=c.plat+'|'+c.obj, v=c.adjInst+c.bookings;
    if(c.synthetic) nameless[k]=(nameless[k]||0)+v; else named[k]=(named[k]||0)+v;
  });
  list.forEach(function(c){
    var k=c.plat+'|'+c.obj;
    c.blindLine=!!(c.spend>0&&!c.adjInst&&!c.bookings&&(nameless[k]||0)>(named[k]||0));
  });

  list.forEach(function(c){
    var web=webRevenue(c.plat+'|'+c.obj);
    c.revenue=web?c.ga4Rev:c.adjRev;
    c.revSrc=web?'GA4':'Adjust';
    c.noFeed=c.spend>0&&noFeed(c.brand,c.plat);
    c.nDays=Object.keys(c.days).length;
    c.cpm=c.impr?c.spend/c.impr*1000:null;
    c.cpc=c.clicks?c.spend/c.clicks:null;
    c.ctr=c.impr?c.clicks/c.impr*100:null;
    c.cpiPlat=c.inst?c.spend/c.inst:null;
    c.cpi=(c.spend>0&&c.adjInst>=0.5)?c.spend/c.adjInst:null;
    c.cpa=(c.spend>0&&c.bookings>=0.5)?c.spend/c.bookings:null;
    c.roas=c.spend?c.revenue/(c.spend*DATA.meta.fx):null;
  });
  return list.filter(function(c){
      return c.spend||c.impr||c.clicks||c.inst||c.purch||c.adjInst||c.bookings||
        c.adjRev||c.ga4Tx||c.ga4Rev;
    }).sort(function(a,b){return b.spend-a.spend||b.adjInst-a.adjInst;});
}
/* platform-claimed installs vs Adjust-verified, for exactly the rows on screen */
function claimVsVerified(){
  var claim={},ver={};
  rowsRaw().forEach(function(r){ claim[r[P]]=(claim[r[P]]||0)+r[INS]; });
  adjustRows().forEach(function(a){
    var p=a.line.split('|')[0];
    if(p!=='Other') ver[p]=(ver[p]||0)+a.inst;
  });
  var keys={};Object.keys(claim).forEach(function(k){keys[k]=1;});Object.keys(ver).forEach(function(k){keys[k]=1;});
  return Object.keys(keys).map(function(k){
    return {plat:k,claimed:claim[k]||0,verified:ver[k]||0,
      ratio:(ver[k]?(claim[k]||0)/ver[k]:null)};
  }).filter(function(x){return x.claimed>0||x.verified>0;})
    .sort(function(a,b){return b.verified-a.verified;});
}

/* ================================================================
 * week-over-week
 * ================================================================ */
function splitWeeks(){
  /* compare delivered days only — trailing days with no media rows yet would read as a drop */
  var last=lastMediaDay();
  var s=series().filter(function(d){return !last||d.day<=last;});
  if(s.length<4) return null;
  var n=Math.min(7,Math.floor(s.length/2));
  return {cur:s.slice(-n),prev:s.slice(-2*n,-n),n:n};
}
function wow(){
  var w=splitWeeks();if(!w)return null;
  function agg(list){
    var t={spend:0,impr:0,clicks:0,inst:0,purch:0};
    list.forEach(function(d){t.spend+=d.spend;t.impr+=d.impr;t.clicks+=d.clicks;t.inst+=d.inst;t.purch+=d.purch;});
    t.cpm=t.impr?t.spend/t.impr*1000:null;
    t.cpc=t.clicks?t.spend/t.clicks:null;
    t.ctr=t.impr?t.clicks/t.impr*100:null;
    t.cpi=t.inst?t.spend/t.inst:null;
    return t;
  }
  return {n:w.n,cur:agg(w.cur),prev:agg(w.prev)};
}
function wowByPlat(){
  var w=splitWeeks();if(!w)return[];
  var out={};
  function add(list,key){
    list.forEach(function(d){
      for(var p in d.byPlat){
        var e=out[p]||(out[p]={plat:p,curSpend:0,prevSpend:0,curInst:0,prevInst:0});
        e[key+'Spend']+=d.byPlat[p];
      }
    });
  }
  add(w.cur,'cur');add(w.prev,'prev');
  // installs by platform need a second pass over raw
  var curDays={},prevDays={};
  w.cur.forEach(function(d){curDays[d.day]=1;});
  w.prev.forEach(function(d){prevDays[d.day]=1;});
  rowsRaw().forEach(function(r){
    var e=out[r[P]];if(!e)return;
    if(curDays[r[D]]) e.curInst+=r[INS];
    else if(prevDays[r[D]]) e.prevInst+=r[INS];
  });
  return Object.keys(out).map(function(k){
    var e=out[k];
    e.dSpend=e.prevSpend?(e.curSpend-e.prevSpend)/e.prevSpend*100:null;
    e.curCpi=e.curInst?e.curSpend/e.curInst:null;
    e.prevCpi=e.prevInst?e.prevSpend/e.prevInst:null;
    e.dCpi=(e.curCpi&&e.prevCpi)?(e.curCpi-e.prevCpi)/e.prevCpi*100:null;
    return e;
  }).sort(function(a,b){return b.curSpend-a.curSpend;});
}

/* ================================================================
 * insights — generated, not hand-written
 * ================================================================ */
function insights(){
  var out=[],w=wow(),wp=wowByPlat(),cv=claimVsVerified();
  if(w&&w.prev.spend>0){
    var d=(w.cur.spend-w.prev.spend)/w.prev.spend*100;
    out.push({ico:'◈',txt:'Spend over the last <b>'+w.n+' days</b> is '+
      (d>=0?'up':'down')+' vs the '+w.n+' before it',
      val:(d>=0?'+':'')+d.toFixed(0)+'%',cls:d>=0?'up':'down'});
  }
  if(w&&w.prev.cpi&&w.cur.cpi){
    var c=(w.cur.cpi-w.prev.cpi)/w.prev.cpi*100;
    out.push({ico:c<0?'▼':'▲',
      txt:'Cost per install is '+(c<0?'improving':'getting worse')+' (platform count — daily only)',
      val:usd2(w.prev.cpi)+' → '+usd2(w.cur.cpi),cls:c<0?'up':'down'});
  }
  var best=wp.filter(function(p){return p.dCpi!=null&&p.dCpi<-2&&p.curSpend>300;})
    .sort(function(a,b){return a.dCpi-b.dCpi;})[0];
  if(best) out.push({ico:'★',txt:'<b>'+best.plat+'</b> improved its cost per install the most',
    val:best.dCpi.toFixed(0)+'%',cls:'up'});
  else if(wp.filter(function(p){return p.dCpi!=null&&p.curSpend>300;}).length)
    out.push({ico:'◦',txt:'No platform brought its cost per install down this week',
      val:'—',cls:'flat'});
  var worst=wp.filter(function(p){return p.dCpi!=null&&p.curSpend>300;})
    .sort(function(a,b){return b.dCpi-a.dCpi;})[0];
  if(worst&&best&&worst.plat!==best.plat&&worst.dCpi>5)
    out.push({ico:'!',txt:'<b>'+worst.plat+'</b> got more expensive per install — worth a look',
      val:'+'+worst.dCpi.toFixed(0)+'%',cls:'down'});
  var stopped=wp.filter(function(p){return p.prevSpend>200&&p.curSpend<p.prevSpend*0.15;});
  stopped.forEach(function(p){
    out.push({ico:'◌',txt:'<b>'+p.plat+'</b> has nearly stopped delivering',
      val:usd(p.prevSpend)+' → '+usd(p.curSpend),cls:'down'});
  });
  var over=cv.filter(function(x){return x.ratio&&x.ratio>1.4&&x.verified>200;})
    .sort(function(a,b){return b.ratio-a.ratio;})[0];
  if(over) out.push({ico:'⚑',
    txt:'<b>'+over.plat+'</b> reports far more installs than Adjust verifies',
    val:over.ratio.toFixed(2)+'× over',cls:'down'});
  return out;
}
/* pacing projection — per-day rate over the days actually delivered so far */
function pacing(){
  var s=series();if(!s.length)return null;
  var spent=s.reduce(function(a,d){return a+d.spend;},0);
  var last=lastMediaDay();
  var elapsed=s.filter(function(d){return !last||d.day<=last;}).length||s.length;
  var perDay=spent/elapsed;
  var all=DATA.meta.days.length;
  return {spent:spent,perDay:perDay,elapsed:elapsed,inRange:s.length,total:all,
    projected:perDay*all, share:elapsed/all*100};
}

/* ================================================================
 * tooltip
 * ================================================================ */
var TIP=document.getElementById('tip');
function showTip(x,y,html){
  TIP.innerHTML=html;TIP.classList.add('on');
  var r=TIP.getBoundingClientRect();
  var left=x+14, top=y-r.height-10;
  if(left+r.width>window.innerWidth-8) left=x-r.width-14;
  if(top<8) top=y+16;
  TIP.style.left=left+'px';TIP.style.top=top+'px';
}
function hideTip(){TIP.classList.remove('on');}
function tipRows(title,rows){
  return '<div class="tt">'+esc(title)+'</div>'+rows.map(function(r){
    return '<div class="tr"><span>'+esc(r[0])+'</span><span>'+r[1]+'</span></div>';
  }).join('');
}

/* ================================================================
 * charts
 * ================================================================ */
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function hidpi(cv,h){
  var w=cv.clientWidth||cv.parentNode.clientWidth||600,r=window.devicePixelRatio||1;
  cv.width=w*r;cv.height=h*r;cv.style.height=h+'px';
  var c=cv.getContext('2d');c.setTransform(r,0,0,r,0,0);
  return {c:c,w:w,h:h};
}
function bindHover(cv,hit){
  cv.onmousemove=function(e){
    var b=cv.getBoundingClientRect();
    var h=hit(e.clientX-b.left,e.clientY-b.top);
    if(h) showTip(e.clientX,e.clientY,h); else hideTip();
  };
  cv.onmouseleave=hideTip;
}

/** Sparkline with a hover readout. */
function sparkline(cv,days,vals,fmt,label){
  var g=hidpi(cv,26),c=g.c,w=g.w,h=g.h;
  if(!vals.length)return;
  var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals.concat([0]));
  var sx=function(i){return vals.length<2?0:i/(vals.length-1)*(w-2)+1;};
  var sy=function(v){return mx===mn?h/2:h-2-(v-mn)/(mx-mn)*(h-5);};
  var acc=css('--accent');
  c.beginPath();c.moveTo(sx(0),h);
  vals.forEach(function(v,i){c.lineTo(sx(i),sy(v));});
  c.lineTo(sx(vals.length-1),h);c.closePath();c.fillStyle=acc+'1f';c.fill();
  c.beginPath();vals.forEach(function(v,i){i?c.lineTo(sx(i),sy(v)):c.moveTo(sx(i),sy(v));});
  c.strokeStyle=acc;c.lineWidth=1.5;c.lineJoin='round';c.stroke();
  c.beginPath();c.arc(sx(vals.length-1),sy(vals[vals.length-1]),2.4,0,7);c.fillStyle=acc;c.fill();
  bindHover(cv,function(mx2){
    if(vals.length<2)return null;
    var i=Math.round((mx2-1)/(w-2)*(vals.length-1));
    i=Math.max(0,Math.min(vals.length-1,i));
    return tipRows(days[i],[[label,fmt(vals[i])]]);
  });
}

/** Stacked daily columns with a full per-platform tooltip. */
function stackedDaily(cv,dd,plats,metric,fmt,label){
  var g=hidpi(cv,290),c=g.c,w=g.w,h=g.h;
  var PL=54,PR=14,PT=14,PB=34,iw=w-PL-PR,ih=h-PT-PB;
  var tot=dd.map(function(d){
    if(metric!=='spend')return d[metric]||0;
    var s=0;for(var k in d.byPlat)s+=d.byPlat[k];return s;
  });
  var mx=Math.max.apply(null,tot.concat([1]));
  var step=Math.pow(10,Math.floor(Math.log(mx)/Math.LN10));
  var top=Math.ceil(mx/step)*step||1;
  var line=css('--line-soft'),ink4=css('--ink-4');
  c.font='10px '+css('--mono');
  for(var i=0;i<=4;i++){
    var y=PT+ih-ih*i/4,v=top*i/4;
    c.strokeStyle=line;c.lineWidth=1;
    c.beginPath();c.moveTo(PL,y+.5);c.lineTo(w-PR,y+.5);c.stroke();
    c.fillStyle=ink4;c.textAlign='right';c.textBaseline='middle';
    c.fillText(v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':Math.round(v),PL-7,y);
  }
  var bw=iw/dd.length,gap=Math.min(3,bw*.22),cw=Math.max(1,bw-gap);
  dd.forEach(function(d,i){
    var x=PL+i*bw+gap/2,y=PT+ih;
    if(metric==='spend'){
      plats.forEach(function(p){
        var v=d.byPlat[p]||0;if(!v)return;
        var bh=v/top*ih;y-=bh;
        c.fillStyle=PLAT_COLOR[p]||'#888';c.fillRect(x,y,cw,bh);
      });
    }else{
      var v=d[metric]||0,bh=v/top*ih;y-=bh;
      c.fillStyle=css('--accent');c.fillRect(x,y,cw,bh);
    }
  });
  c.fillStyle=ink4;c.textAlign='center';c.textBaseline='top';c.font='9.5px '+css('--mono');
  var every=Math.max(1,Math.ceil(dd.length/11)), last=dd.length-1;
  dd.forEach(function(d,i){
    if(i%every&&i!==last)return;
    if(i!==last&&last-i<every)return;   // keep a clear gap before the final label
    c.fillText(shortDay(d.day),PL+i*bw+bw/2,PT+ih+8);
  });
  bindHover(cv,function(x){
    var i=Math.floor((x-PL)/bw);
    if(i<0||i>=dd.length)return null;
    var d=dd[i],rows=[];
    if(metric==='spend'){
      plats.forEach(function(p){if(d.byPlat[p])rows.push([p,usd(d.byPlat[p])]);});
      rows.push(['Total',usd(tot[i])]);
    }else rows.push([label,fmt(d[metric]||0)]);
    return tipRows(d.day,rows);
  });
}

/** Efficiency over time: a 7-day rolling cost metric, so noise doesn't mask trend. */
function effLine(cv,dd,metric){
  var g=hidpi(cv,270),c=g.c,w=g.w,h=g.h;
  var PL=56,PR=14,PT=16,PB=34,iw=w-PL-PR,ih=h-PT-PB;
  var win=7,pts=[];
  for(var i=0;i<dd.length;i++){
    var a=Math.max(0,i-win+1),s=0,imp=0,clk=0,ins=0,vin=0,bk=0,rv=0;
    for(var j=a;j<=i;j++){s+=dd[j].spend;imp+=dd[j].impr;clk+=dd[j].clicks;ins+=dd[j].inst;
      vin+=dd[j].adjInst||0;bk+=dd[j].bookings||0;rv+=dd[j].revenue||0;}
    var v=metric==='cpi'?(vin?s/vin:null):                 /* Adjust-verified */
          metric==='cpiPlat'?(ins?s/ins:null):             /* what the platform claims */
          metric==='cpa'?(bk?s/bk:null):
          metric==='roas'?(s?rv/(s*DATA.meta.fx):null):
          metric==='cpm'?(imp?s/imp*1000:null):
          metric==='cpc'?(clk?s/clk:null):(imp?clk/imp*100:null);
    pts.push(v);
  }
  var vals=pts.filter(function(v){return v!=null;});
  if(!vals.length){
    c.fillStyle=css('--ink-4');c.font='12px '+css('--body');c.textAlign='center';
    c.fillText('No data for this metric in range',w/2,h/2);return;
  }
  var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals);
  var pad=(mx-mn)*.18||mx*.2||1;mx+=pad;mn=Math.max(0,mn-pad);
  var line=css('--line-soft'),ink4=css('--ink-4'),acc=css('--accent');
  var isPct=metric==='ctr',isX=metric==='roas';
  c.font='10px '+css('--mono');
  for(var k=0;k<=4;k++){
    var y=PT+ih-ih*k/4,v=mn+(mx-mn)*k/4;
    c.strokeStyle=line;c.beginPath();c.moveTo(PL,y+.5);c.lineTo(w-PR,y+.5);c.stroke();
    c.fillStyle=ink4;c.textAlign='right';c.textBaseline='middle';
    c.fillText(isPct?v.toFixed(2)+'%':isX?v.toFixed(2)+'×':'$'+v.toFixed(2),PL-7,y);
  }
  var sx=function(i){return PL+(dd.length<2?0:i/(dd.length-1)*iw);};
  var sy=function(v){return PT+ih-(v-mn)/(mx-mn)*ih;};
  c.beginPath();var started=false;
  pts.forEach(function(v,i){if(v==null)return;started?c.lineTo(sx(i),sy(v)):(c.moveTo(sx(i),sy(v)),started=true);});
  c.strokeStyle=acc;c.lineWidth=2;c.lineJoin='round';c.stroke();
  var lastI=-1;pts.forEach(function(v,i){if(v!=null)lastI=i;});
  if(lastI>=0){c.beginPath();c.arc(sx(lastI),sy(pts[lastI]),3.6,0,7);c.fillStyle=acc;c.fill();}
  c.fillStyle=ink4;c.textAlign='center';c.textBaseline='top';c.font='9.5px '+css('--mono');
  var every=Math.max(1,Math.ceil(dd.length/11)), last=dd.length-1;
  dd.forEach(function(d,i){
    if(i%every&&i!==last)return;
    if(i!==last&&last-i<every)return;
    c.fillText(shortDay(d.day),sx(i),PT+ih+8);
  });
  bindHover(cv,function(x){
    if(dd.length<2)return null;
    var i=Math.round((x-PL)/iw*(dd.length-1));
    i=Math.max(0,Math.min(dd.length-1,i));
    if(pts[i]==null)return null;
    var lbl={cpi:'CPI (7-day)',cpiPlat:'CPI claimed (7-day)',cpa:'CPA (7-day)',roas:'ROAS (7-day)',
      cpm:'CPM (7-day)',cpc:'CPC (7-day)',ctr:'CTR (7-day)'}[metric];
    return tipRows(dd[i].day,[[lbl,isPct?pts[i].toFixed(2)+'%':isX?n2(pts[i])+'×':usd2(pts[i])],
      ['Spend that day',usd(dd[i].spend)]]);
  });
}

/** Cumulative spend against an even-pace reference. */
function cumulative(cv,dd){
  var g=hidpi(cv,270),c=g.c,w=g.w,h=g.h;
  var PL=56,PR=14,PT=16,PB=34,iw=w-PL-PR,ih=h-PT-PB;
  var run=0,cum=dd.map(function(d){run+=d.spend;return run;});
  var top=Math.max.apply(null,cum.concat([1]))*1.04;
  var line=css('--line-soft'),acc=css('--accent'),ink4=css('--ink-4');
  c.font='10px '+css('--mono');
  for(var i=0;i<=4;i++){
    var y=PT+ih-ih*i/4,v=top*i/4;
    c.strokeStyle=line;c.beginPath();c.moveTo(PL,y+.5);c.lineTo(w-PR,y+.5);c.stroke();
    c.fillStyle=ink4;c.textAlign='right';c.textBaseline='middle';
    c.fillText('$'+(v>=1000?(v/1000).toFixed(0)+'k':Math.round(v)),PL-7,y);
  }
  var sx=function(i){return PL+(dd.length<2?0:i/(dd.length-1)*iw);};
  var sy=function(v){return PT+ih-v/top*ih;};
  var fin=cum[cum.length-1];
  c.setLineDash([4,4]);c.strokeStyle=ink4;c.lineWidth=1;
  c.beginPath();c.moveTo(sx(0),sy(fin/dd.length));c.lineTo(sx(dd.length-1),sy(fin));c.stroke();
  c.setLineDash([]);
  c.beginPath();c.moveTo(sx(0),PT+ih);
  cum.forEach(function(v,i){c.lineTo(sx(i),sy(v));});
  c.lineTo(sx(cum.length-1),PT+ih);c.closePath();
  var grd=c.createLinearGradient(0,PT,0,PT+ih);
  grd.addColorStop(0,acc+'38');grd.addColorStop(1,acc+'05');c.fillStyle=grd;c.fill();
  c.beginPath();cum.forEach(function(v,i){i?c.lineTo(sx(i),sy(v)):c.moveTo(sx(i),sy(v));});
  c.strokeStyle=acc;c.lineWidth=2;c.lineJoin='round';c.stroke();
  c.beginPath();c.arc(sx(cum.length-1),sy(fin),3.6,0,7);c.fillStyle=acc;c.fill();
  c.fillStyle=ink4;c.textAlign='center';c.textBaseline='top';c.font='9.5px '+css('--mono');
  var every=Math.max(1,Math.ceil(dd.length/11)), last=dd.length-1;
  dd.forEach(function(d,i){
    if(i%every&&i!==last)return;
    if(i!==last&&last-i<every)return;
    c.fillText(shortDay(d.day),sx(i),PT+ih+8);
  });
  bindHover(cv,function(x){
    if(dd.length<2)return null;
    var i=Math.round((x-PL)/iw*(dd.length-1));
    i=Math.max(0,Math.min(dd.length-1,i));
    var even=fin/dd.length*(i+1);
    return tipRows(dd[i].day,[['Spent to date',usd(cum[i])],['Even pace would be',usd(even)],
      ['Difference',(cum[i]>=even?'+':'')+usd(cum[i]-even)]]);
  });
}

/* ================================================================

function render(){

  cc.className='chip live'+(ok&&!crit&&!(coverage&&coverage.bad)?'':' bad');

/* Data problems live in the sheet, so the pacing tab has them too. Listing them here is
   the only honest option — patching them silently in the browser is what made the
   dashboard and the tab disagree before. */
function renderHealth(){
  var el=document.getElementById('health'),list=healthIssues();
  if(!list.length){el.innerHTML='';return;}
  var crit=list.filter(function(i){return i.level==='crit';});
  var warn=list.filter(function(i){return i.level!=='crit';});
  el.innerHTML='<details class="callout'+(crit.length?' crit':'')+'"'+(crit.length?' open':'')+'>'+
    '<summary><b>'+(crit.length?crit.length+' data problem'+(crit.length===1?'':'s')+' in the sheet':'Data notes')+
    '</b>'+(warn.length&&crit.length?' · '+warn.length+' note'+(warn.length===1?'':'s'):'')+
    ' — they affect the pacing tab exactly as they affect these numbers</summary><ul>'+
    crit.concat(warn).map(function(i){
      return '<li><span class="pill '+(i.level==='crit'?'crit':'warn')+'">'+(i.level==='crit'?'fix':'note')+
        '</span> '+esc(i.text)+'</li>';
    }).join('')+'</ul></details>';
}

function renderKpis(){
  var rs=rowsRaw(),t=sumRaw(rs),ln=lines(),a=totals(ln),s=series(),pc=pacing();
  // A partner can have valid Adjust outcomes without any media-cost feed. Showing
  // $0 in that case falsely claims zero spend; an em dash states the source truth.
  var mediaMissing=!rs.length&&(adjustRows().length>0||ga4Rows().length>0);
  var days=s.map(function(d){return d.day;});
  var spendSar=t.spend*DATA.meta.fx, rev=a.revenue;
  var gaCounted=DATA.meta.webRevenueFromGa4;
  var cards=[
    {k:'Spend',v:mediaMissing?'—':usd(t.spend),s:mediaMissing?'No media-spend source':sar(spendSar),
      sp:mediaMissing?null:s.map(function(d){return d.spend;}),fmt:usd,lab:'Spend'},
    {k:'Revenue',v:sar(rev),
      s:gaCounted?'Adjust app '+n0(rev-sumWebGa4(ln))+' + GA4 web '+n0(sumWebGa4(ln))+' · column X':
        'Adjust · column X · GA4 web '+n0(a.ga4Rev)+' SAR not added'},
    {k:'ROAS',v:spendSar?n2(rev/spendSar)+'×':'—',s:'revenue ÷ spend SAR · P28',
      state:spendSar?(rev/spendSar>=2.5?'good':rev/spendSar>=1.5?'warn':'crit'):null},
    {k:'Installs — Adjust',v:n0(a.adjInst),
      s:mediaMissing?'CPI — · no media-spend source':
        'CPI '+usd2(a.adjInst?t.spend/a.adjInst:null)+' · '+n0(t.inst)+' claimed by platforms'},
    {k:'Impressions',v:mediaMissing?'—':n0(t.impr),s:mediaMissing?'No media-delivery source':'CPM '+usd2(t.cpm),
      sp:mediaMissing?null:s.map(function(d){return d.impr;}),fmt:n0,lab:'Impressions'},
    {k:'Clicks',v:mediaMissing?'—':n0(t.clicks),s:mediaMissing?'No media-delivery source':'CTR '+pct(t.ctr)+' · CPC '+usd2(t.cpc),
      sp:mediaMissing?null:s.map(function(d){return d.clicks;}),fmt:n0,lab:'Clicks'},
    {k:'Bookings — Adjust',v:n0(a.bookings),
      s:mediaMissing?'CPA — · no media-spend source':
        'CPA '+usd2(a.bookings?t.spend/a.bookings:null)+' · GA4 web purchases '+n0(a.ga4Tx)},
    {k:'Daily run-rate',v:mediaMissing||!pc?'—':usd(pc.perDay),
      s:mediaMissing||!pc?'No media-spend source':'over '+pc.elapsed+' delivered day'+(pc.elapsed===1?'':'s'),
      sp:mediaMissing?null:(function(){var r=0;return s.map(function(d){return r+=d.spend;});})(),fmt:usd,lab:'Cumulative'}
  ];
  document.getElementById('kpis').innerHTML=cards.map(function(c,i){
    return '<div class="kpi">'+
      '<div class="k">'+c.k+'</div><div class="v">'+c.v+'</div>'+
      '<div class="s">'+(c.state?'<span class="pill '+c.state+'">'+c.state.toUpperCase()+'</span> ':'')+c.s+'</div>'+
      (c.sp?'<canvas class="spark" data-spark="'+i+'"></canvas>':'')+'</div>';
  }).join('');
  window.__sparks=cards.map(function(c){return c.sp?{v:c.sp,d:days,f:c.fmt,l:c.lab}:null;});
}

  });

  var m={};

    e.tx+=g.tx;e.revenue+=g.revenue;

var _pfx={};
function commonPrefix(){
  if(BRAND==='BOTH')return '';   // the two brands share no prefix worth stripping
  if(_pfx[BRAND]!=null)return _pfx[BRAND];
  var names=DATA.raw.filter(function(r){return brandMatch(r[B]);}).map(function(r){return r[C];});
  var p='';
  if(names.length>1){
    p=names[0];
    names.forEach(function(n){var i=0;while(i<p.length&&i<n.length&&p[i]===n[i])i++;p=p.slice(0,i);});
    var cut=Math.max(p.lastIndexOf('_'),p.lastIndexOf('-'),p.lastIndexOf(' '));
    p=cut>4?p.slice(0,cut+1):'';
  }
  return (_pfx[BRAND]=p);
}
function shortName(n){
  var s=String(n),p=commonPrefix();
  if(p&&s.indexOf(p)===0&&s.length>p.length+4)s=s.slice(p.length);
  s=s.replace(/_NA(?=_)/g,'').replace(/_{2,}/g,'_');
  return s.length<=40?s:'…'+s.slice(-39);
}

function sortBy(k){SORT=SORT.key===k?{key:k,dir:-SORT.dir}:{key:k,dir:k==='row'||k==='plat'||k==='obj'?1:-1};render();}
function sortList(list){
  var k=SORT.key,d=SORT.dir;
  return list.slice().sort(function(a,b){
    var x=a[k],y=b[k];
    if(x==null)return 1;if(y==null)return -1;
    if(typeof x==='string')return d*x.localeCompare(y);
    return d*(x-y);
  });
}

            {k:'inst',    h:'Platform install',src:'raw'},
            {k:'adjInst', h:'Adjust install',  src:'adj'},
            {k:'cpi',     h:'CPI',             src:'adj'},
            {k:'bookings',h:'Adjust purchase', src:'adj'},
            {k:'cpa',     h:'CPA',             src:'adj'},
            {k:'ga4Tx',   h:'GA4 purchase',    src:'ga4'},
            {k:'revenue', h:'Revenue',         src:'rev'},
            {k:'roas',    h:'ROAS',            src:'rev'}];
  function head(){
    return '<thead><tr>'+COLS.map(function(c){
      var on=CSORT.key===c.k;
      return '<th class="sortable'+(on?' sorted'+(CSORT.dir>0?' asc':''):'')+'"'+
        (SRC_WHY[c.src]?' title="'+SRC_WHY[c.src]+'"':'')+
        ' onclick="csortBy(\''+c.k+'\')">'+c.h+(c.src==='rev'?revTag():SRC_TAG[c.src]||'')+'</th>';
      }).join('')+'</tr></thead>';
  }
  function srt(list){
    var k=CSORT.key,d=CSORT.dir;
    return list.slice().sort(function(a,b){
      var x=a[k],y=b[k];
      if(x==null)return 1; if(y==null)return -1;
      if(typeof x==='string')return d*x.localeCompare(y);
      return d*(x-y);
    });
  }
  function row(c){
    var st=c.roas==null?'':(c.obj==='Awareness'?'mute':
      c.roas>=2.5?'good':c.roas>=1.5?'warn':c.roas>0?'crit':'mute');
    /* A row with conversions but no spend is Adjust or GA4 naming a campaign the
       platform export does not carry over this window. Say so on the row. */
    var flag=c.noSpend?' <span class="tag" title="Adjust or GA4 reports this name, '+
      'but Raw data has no spend for it in this window — so there is no CPI or ROAS to '+
      'work out. The conversions are real and are counted in the totals.">no spend in range</span>':
      (c.noFeed?' <span class="tag frz" title="'+NOFEED_TIP+'">no Adjust feed</span>':
      (c.blindLine?' <span class="tag" title="This campaign spent, but the platform never '+
      'passes its name to Adjust — the installs and bookings it earned sit on the '+
      'unattributed row for this line. Apple Search Ads reports every campaign as '+
      '&quot;unknown&quot;.">not named by Adjust</span>':''));
    return '<tr'+(c.synthetic?' class="syn"':'')+'><td title="'+esc(c.name)+'">'+esc(shortName(c.name))+
      (BRAND==='BOTH'&&!c.synthetic?' <span class="tag">'+c.brand+'</span>':'')+flag+'</td>'+
      '<td><span class="pdot" style="background:'+(PLAT_COLOR[c.plat]||'#888')+'"></span>'+c.plat+'</td>'+
      '<td><span class="tag">'+c.obj+'</span></td><td>'+(c.nDays||'—')+'</td><td>'+usd(c.spend)+'</td>'+
      '<td>'+n0(c.impr)+'</td><td>'+n0(c.clicks)+'</td><td>'+pct(c.ctr)+'</td>'+
      '<td>'+usd2(c.cpm)+'</td><td>'+usd2(c.cpc)+'</td><td>'+n0(c.inst)+'</td>'+
      '<td>'+n0(c.adjInst)+'</td><td>'+usd2(c.cpi)+'</td>'+
      '<td>'+n0(c.bookings)+'</td><td>'+usd2(c.cpa)+'</td><td>'+n0(c.ga4Tx)+'</td>'+
      '<td>'+n0(c.revenue)+'</td>'+
      '<td>'+(c.roas?'<span class="pill '+st+'">'+n2(c.roas)+'×</span>':'—')+'</td></tr>';
  }
  function agg(list){
    var t={spend:0,impr:0,clicks:0,inst:0,adjInst:0,bookings:0,ga4Tx:0,revenue:0};
    list.forEach(function(c){for(var k in t)t[k]+=c[k]||0;});
    return t;
  }
  function totalCells(t){
    var roas=t.spend?t.revenue/(t.spend*DATA.meta.fx):null;
    return '<td>'+usd(t.spend)+'</td><td>'+n0(t.impr)+'</td><td>'+n0(t.clicks)+'</td>'+
      '<td>'+pct(t.impr?t.clicks/t.impr*100:null)+'</td>'+
      '<td>'+usd2(t.impr?t.spend/t.impr*1000:null)+'</td>'+
      '<td>'+usd2(t.clicks?t.spend/t.clicks:null)+'</td><td>'+n0(t.inst)+'</td>'+
      '<td>'+n0(t.adjInst)+'</td><td>'+usd2(t.adjInst>=0.5&&t.spend?t.spend/t.adjInst:null)+'</td>'+
      '<td>'+n0(t.bookings)+'</td><td>'+usd2(t.bookings>=0.5&&t.spend?t.spend/t.bookings:null)+'</td>'+
      '<td>'+n0(t.ga4Tx)+'</td><td>'+n0(t.revenue)+'</td>'+
      '<td>'+(roas?n2(roas)+'×':'—')+'</td>';
  }
  function subtotal(label,list,color){
    return '<tr class="grp"><td colspan="4">'+
      (color?'<span class="pdot" style="background:'+color+'"></span>':'')+label+
      ' <span class="cnt">'+list.length+'</span></td>'+totalCells(agg(list))+'</tr>';
  }
  function grandTotal(list){
    return '<tfoot><tr><td colspan="4">Total</td>'+totalCells(agg(list))+'</tr></tfoot>';
  }
  var srckey='<div class="srckey"><span><sup class="src adj">A</sup> Adjust, matched to the '+
    'campaign by name</span>'+
    '<span><sup class="src ga4">G</sup> GA4, matched by session campaign name</span>'+
    '<span>no mark = the platform\'s own export</span>'+
    '<span>Revenue and ROAS = column X of the pacing tab</span></div>';
  if(GROUP==='none')
    return '<table>'+head()+'<tbody>'+srt(cs).map(row).join('')+'</tbody>'+
      grandTotal(cs)+'</table>'+srckey;
  var key=GROUP==='plat'?'plat':'obj';
  var groups={};
  cs.forEach(function(c){ (groups[c[key]]=groups[c[key]]||[]).push(c); });
  var order=Object.keys(groups).sort(function(a,b){
    var sa=0,sb=0;
    groups[a].forEach(function(c){sa+=c.spend;}); groups[b].forEach(function(c){sb+=c.spend;});
    return sb-sa;
  });
  return '<table>'+head()+'<tbody>'+order.map(function(g){
    return subtotal(g,groups[g],key==='plat'?(PLAT_COLOR[g]||'#888'):null)+
      srt(groups[g]).map(row).join('');
  }).join('')+'</tbody>'+grandTotal(cs)+'</table>'+srckey;
}
function campRank(list,key,dir,fmt){
  var s=list.slice().sort(function(a,b){return dir*(a[key]-b[key]);}).slice(0,6);
  if(!s.length)return '<div class="empty">Not enough volume to rank</div>';
  return '<ol class="rank">'+s.map(function(c,i){
    return '<li><span class="rk">'+(i+1)+'</span><span class="rn" title="'+esc(c.name)+'">'+
      esc(shortName(c.name))+'<em><span class="pdot" style="background:'+(PLAT_COLOR[c.plat]||'#888')+'"></span>'+
      (BRAND==='BOTH'?c.brand+' · ':'')+c.plat+' · '+usd(c.spend)+' · '+n0(c.inst)+' inst</em></span>'+
      '<span class="rv">'+fmt(c[key])+'</span></li>';}).join('')+'</ol>';
}
function platRank(list,key,fmt){
  if(!list.length)return '<div class="empty">No Adjust data for this selection</div>';
  return '<ol class="rank">'+list.map(function(e,i){
    return '<li><span class="rk">'+(i+1)+'</span><span class="rn">'+
      '<span class="pdot" style="background:'+(PLAT_COLOR[e.plat]||'#888')+'"></span>'+e.plat+
      '<em>'+usd(e.spend)+' · '+n0(e.adjInst)+' installs · '+n0(e.bookings)+' bookings</em></span>'+
      '<span class="rv">'+fmt(e[key])+'</span></li>';}).join('')+'</ol>';
}
function claimPanel(cv){
  if(!cv.length)return '<div class="empty">No install data</div>';
  var mx=Math.max.apply(null,cv.map(function(x){return Math.max(x.claimed,x.verified);}))||1;
  return '<div class="cv">'+cv.map(function(x){
    var cls=x.ratio==null?'mute':x.ratio>=1.4?'crit':x.ratio>=1.15?'warn':'good';
    return '<div class="cvr"><div class="h"><span class="nm">'+
      '<span class="pdot" style="background:'+(PLAT_COLOR[x.plat]||'#888')+'"></span>'+x.plat+'</span>'+
      '<span>'+(x.ratio!=null?'<span class="pill '+cls+'">'+x.ratio.toFixed(2)+'× claimed</span>':
        '<span class="pill mute">'+(noFeed('',x.plat)?'no Adjust feed':'no Adjust installs')+'</span>')+'</span></div>'+
      '<div class="cvbar"><i class="claim" style="width:'+(x.claimed/mx*100).toFixed(1)+'%"></i>'+
      '<i class="ver" style="width:'+(x.verified/mx*100).toFixed(1)+'%"></i></div>'+
      '<div class="f"><span>platform says '+n0(x.claimed)+'</span>'+
      '<span>Adjust verifies '+n0(x.verified)+'</span></div></div>';
  }).join('')+'</div>';
}
function smallMultiples(s,plats){
  var w=wowByPlat(),byP={};w.forEach(function(x){byP[x.plat]=x;});
  return '<div class="sm">'+plats.map(function(p,i){
    var vals=s.map(function(d){return d.byPlat[p]||0;});
    var tot=vals.reduce(function(a,b){return a+b;},0);
    var e=byP[p],d=e?e.dSpend:null;
    var arrow=d==null?'':(d>3?'▲':d<-3?'▼':'▬');
    var cls=d==null?'flat':d>3?'up':d<-3?'down':'flat';
    return '<div class="smc"><div class="t"><span class="nm">'+
      '<span class="pdot" style="background:'+(PLAT_COLOR[p]||'#888')+'"></span>'+p+'</span>'+
      '<span class="delta '+cls+'" style="font-size:11.5px">'+arrow+' '+
        (d==null?'—':(d>=0?'+':'')+d.toFixed(0)+'%')+'</span></div>'+
      '<div class="v">'+usd(tot)+'</div>'+
      '<div class="m">'+(e&&e.curCpi?'CPI (claimed) '+usd2(e.curCpi):'&nbsp;')+'</div>'+
      '<canvas data-mini="'+i+'" data-plat="'+p+'"></canvas></div>';
  }).join('')+'</div>';
}
function wowTable(w){
  if(!w.length)return '<div class="empty">Not enough days in range</div>';
  return '<table><thead><tr><th>Platform</th><th>Spend now</th><th>Spend before</th><th>Δ spend</th>'+
    '<th>Installs now</th><th>Installs before</th><th>CPI now</th><th>CPI before</th><th>Δ CPI</th></tr></thead><tbody>'+
    w.map(function(e){
      function d(v,invert){
        if(v==null)return '<span class="delta flat">—</span>';
        var good=invert?v<0:v>0;
        var cls=Math.abs(v)<3?'flat':good?'up':'down';
        return '<span class="delta '+cls+'">'+(v>=0?'+':'')+v.toFixed(0)+'%</span>';
      }
      return '<tr><td><span class="pdot" style="background:'+(PLAT_COLOR[e.plat]||'#888')+'"></span>'+e.plat+'</td>'+
        '<td>'+usd(e.curSpend)+'</td><td>'+usd(e.prevSpend)+'</td><td>'+d(e.dSpend)+'</td>'+
        '<td>'+n0(e.curInst)+'</td><td>'+n0(e.prevInst)+'</td>'+
        '<td>'+usd2(e.curCpi)+'</td><td>'+usd2(e.prevCpi)+'</td><td>'+d(e.dCpi,true)+'</td></tr>';
    }).join('')+'</tbody></table>';
}
function revenueBars(ln){
  var rs=ln.filter(function(l){return l.revenue>0;}).sort(function(a,b){return b.revenue-a.revenue;});
  if(!rs.length)return '<div class="empty">No revenue attributed for this selection</div>';
  var mx=rs[0].revenue;
  return rs.map(function(l){
    return '<div style="display:grid;grid-template-columns:minmax(150px,1fr) 2fr 96px;align-items:center;gap:10px;padding:5px 0">'+
      '<div style="font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
      '<span class="pdot" style="background:'+(PLAT_COLOR[l.plat]||'#888')+'"></span>'+l.plat+
      ' <span class="tag">'+(l.plat==='Other'?'row 26':l.obj)+'</span> <span class="tag">'+l.revSrc+'</span></div>'+
      '<div style="height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden">'+
      '<div style="height:100%;border-radius:4px;background:var(--accent);width:'+(l.revenue/mx*100).toFixed(1)+'%"></div></div>'+
      '<div style="font-size:12px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums">'+n0(l.revenue)+'</div></div>';
  }).join('');
}

/* ---------- canvas dispatch ---------- */
function drawAll(){
  if(!DATA)return;
  (window.__sparks||[]).forEach(function(s,i){
    if(!s)return;
    var cv=document.querySelector('[data-spark="'+i+'"]');
    if(cv)sparkline(cv,s.d,s.v,s.f,s.l);
  });
  var s=series(),plats=platsActive(),d;
  if((d=document.getElementById('cDaily'))){
    var fmts={spend:usd,impr:n0,clicks:n0,inst:n0,purch:n0,adjInst:n0,bookings:n0};
    var labs={spend:'Spend',impr:'Impressions',clicks:'Clicks',inst:'Installs (claimed)',purch:'Purchases',
      adjInst:'Installs (Adjust)',bookings:'Bookings (Adjust)'};
    stackedDaily(d,s,plats,DAILY_METRIC,fmts[DAILY_METRIC]||n0,labs[DAILY_METRIC]||DAILY_METRIC);
  }
  if((d=document.getElementById('cEff'))) effLine(d,s,EFF_METRIC);
  if((d=document.getElementById('cCum'))) cumulative(d,s);
  document.querySelectorAll('[data-mini]').forEach(function(cv){
    var p=cv.dataset.plat;
    miniLine(cv,s.map(function(x){return x.day;}),s.map(function(x){return x.byPlat[p]||0;}),'Spend',usd);
  });
}
var _rt;
window.addEventListener('resize',function(){clearTimeout(_rt);_rt=setTimeout(drawAll,140);});
if(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').addEventListener)
  window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',drawAll);

document.documentElement.setAttribute('data-brand','SFQC');
boot();
</script>
